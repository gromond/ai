<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice — TOEFL Learning &amp; Testing Platform</title>
<meta name="description" content="Practice: build your TOEFL skills with focused exercises, realistic practice tests, and progress tracking.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#111;--mut:#666;--faint:#999;--line:#e5e5e5;--soft:#f7f7f7;--bg:#fff}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;padding:11px 14px;border:1px solid #d5d5d5;border-radius:6px;width:100%;background:#fff;color:#111}
input:focus,select:focus,textarea:focus{outline:2px solid #111;outline-offset:1px;border-color:#111}
label{font-size:13px;font-weight:600;display:block;margin:14px 0 6px}
.wrap{max-width:1020px;margin:0 auto;padding:0 24px}
.btn{display:inline-block;padding:11px 20px;border:1px solid #111;border-radius:6px;font-weight:500;font-size:14px;background:#fff;color:#111;text-decoration:none;text-align:center}
.btn.dark{background:#111;color:#fff}
.btn.sm{padding:7px 14px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
nav.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:20}
.navrow{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.logo{font-weight:700;font-size:18px;text-decoration:none}
.navlinks{display:flex;gap:22px;align-items:center;font-size:14px;color:var(--mut)}
.navlinks a{text-decoration:none}.navlinks a:hover{color:#111}
@media(max-width:720px){.navlinks .hideS{display:none}}
.hero{padding:84px 0 64px}
h1{font-size:clamp(36px,5.6vw,58px);line-height:1.1;letter-spacing:-.03em;font-weight:700;max-width:720px;margin-bottom:18px}
h2{font-size:27px;letter-spacing:-.02em;margin-bottom:10px}
h3{font-size:17px;margin-bottom:6px}
.sub{font-size:18px;color:var(--mut);max-width:560px;margin-bottom:30px}
.mut{color:var(--mut)} .small{font-size:13px} .faint{color:var(--faint)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
section.blk{padding:64px 0;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:860px){.grid4,.grid3{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:540px){.grid4,.grid3{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:8px;padding:22px;background:#fff}
.card a{text-decoration:none}
.tag{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.stat{font-size:32px;font-weight:700;letter-spacing:-.02em}
.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#111}
.preview{border:1px solid var(--line);border-radius:8px;padding:22px;margin-top:48px;background:var(--soft)}
.msg{border:1px solid var(--line);border-radius:6px;padding:14px 18px;margin-bottom:12px;font-size:14px;background:#fff}
.msg.err{border-color:#111;background:#f2f2f2}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.qbox{border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:16px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #ddd;border-radius:6px;padding:11px 14px;margin-top:8px;cursor:pointer;font-size:15px}
.opt:hover{border-color:#111}.opt.sel{border-color:#111;background:var(--soft)}
.opt input{width:auto;margin-top:4px}
.opt.correct{border-color:#111;background:#e9e9e9}.opt.wrong{border-color:#999;background:#f7f7f7;text-decoration:line-through}
.passage{white-space:pre-wrap;font-size:16px;line-height:1.75}
.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.qnav{display:flex;gap:6px;flex-wrap:wrap}
.qnav button{width:34px;height:34px;border:1px solid #ccc;border-radius:6px;background:#fff;font-size:13px}
.qnav button.done{background:#111;color:#fff;border-color:#111}
.qnav button.cur{outline:2px solid #111}
footer{padding:36px 0;border-top:1px solid var(--line);color:var(--faint);font-size:13px;margin-top:40px}
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:8px;padding:28px;max-width:440px;width:100%}
.authBox{max-width:420px;margin:56px auto}
textarea{resize:vertical}
.expl{font-size:14px;color:#444;background:var(--soft);border-radius:6px;padding:10px 14px;margin-top:10px}
:focus-visible{outline:2px solid #111;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ================= Practice — TOEFL platform (client app) =================
   Data layer: this build persists to browser localStorage so the full
   product works standalone (demo / single-device classroom use).
   Production multi-user backend: see supabase/schema.sql + .env.example —
   swap the DB object below for Supabase calls with the same shape. */
const LS_KEY = "practice_v1";
const $ = (s, el) => (el||document).querySelector(s);
const $$ = (s, el) => Array.from((el||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
async function hashPw(pw, salt){ const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt+":"+pw)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join(""); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return "—"; return new Date(iso).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}); }
</script>
<script>
/* ================= Seed content (all original) ================= */
const CONTENT = {
reading: [
 { id:"r1", title:"Reading Test 1 — The Honeybee's Compass", minutes:12,
   passage:"Honeybees perform one of nature's most remarkable feats of communication. When a scout bee discovers a rich source of nectar, she returns to the hive and performs a 'waggle dance' on the vertical surface of the honeycomb. The angle of her dance relative to gravity communicates the direction of the flowers relative to the sun, while the duration of the waggle tells her sisters how far they must fly.\n\nFor decades, scientists assumed the dance was the whole story. Recent research, however, suggests that follower bees also pick up faint sounds and air currents produced during the dance, which may help them interpret its message in the darkness of the hive. Moreover, experienced foragers appear to combine the dance's information with their own memories of the landscape, sometimes ignoring directions that conflict with landmarks they already know.\n\nThis combination of shared information and private experience makes the colony flexible. On cloudy days, when the sun is hidden, dances become less precise, yet colonies still forage successfully because veteran bees rely more heavily on memory. The system, in other words, degrades gracefully rather than failing all at once.",
   questions:[
    {q:"What is the passage mainly about?", opts:["How honeybees build honeycombs","How honeybees communicate the location of food","Why scout bees collect nectar","How bees see the sun on cloudy days"], a:1, exp:"The whole passage explains the waggle dance and how bees use it — plus memory — to find food."},
    {q:"According to the passage, the duration of the waggle indicates…", opts:["the quality of the nectar","the number of flowers","the distance to the flowers","the direction of the hive"], a:2, exp:"Paragraph 1: angle gives direction; duration gives distance."},
    {q:"The word 'veteran' in paragraph 3 is closest in meaning to…", opts:["injured","experienced","young","tired"], a:1, exp:"'Veteran bees rely on memory' = bees with experience."},
    {q:"Why does the author mention cloudy days?", opts:["To show the system still works when one information source is weaker","To prove bees cannot fly in bad weather","To explain why hives are dark","To describe a different kind of dance"], a:0, exp:"Cloudy days show the system 'degrades gracefully' because bees fall back on memory."},
    {q:"Which statement is true according to the passage?", opts:["Bees follow dances blindly, ignoring their own knowledge","Sound and air currents may help bees interpret the dance","Only scout bees ever leave the hive","The dance works only on sunny mornings"], a:1, exp:"Paragraph 2 notes sounds and air currents may help followers interpret the dance."}
   ]},
 { id:"r2", title:"Reading Test 2 — Cities That Drink the Rain", minutes:12,
   passage:"For most of modern history, city engineers treated rain as a problem to be removed. Storm drains carried water away as quickly as possible, into rivers and seas. The result, paradoxically, was both flooding and thirst: streets flooded during storms because drains were overwhelmed, while groundwater slowly fell because rain never soaked into the earth.\n\n'Sponge cities' reverse this logic. Instead of sealing the ground with concrete, they use permeable pavements, planted rooftops, wetlands, and sunken gardens that absorb water where it falls. During a storm, these features slow the water down, store it, and release it gradually. During dry weeks, the stored water keeps street trees alive and cools the air through evaporation.\n\nCritics note that sponge features require maintenance: permeable surfaces clog, and wetlands must be managed. Supporters answer that conventional drains also require expensive maintenance, and that sponge systems provide extra benefits — cleaner water, cooler streets, and habitat for birds and insects — that pipes never offer.",
   questions:[
    {q:"What problem with traditional storm drains does the passage describe?", opts:["They were too expensive to invent","They caused both flooding and falling groundwater","They attracted too many birds","They made rivers flow uphill"], a:1, exp:"Paragraph 1: streets flooded while groundwater fell — 'both flooding and thirst'."},
    {q:"A 'sponge city' is best described as a city that…", opts:["bans rainwater collection","absorbs and stores rain where it falls","pumps seawater into its streets","builds larger concrete drains"], a:1, exp:"Paragraph 2 defines sponge cities by permeable surfaces and storage where rain falls."},
    {q:"The word 'paradoxically' suggests the result was…", opts:["completely expected","seemingly contradictory","scientifically impossible","quickly repaired"], a:1, exp:"Flooding and thirst at the same time seem contradictory."},
    {q:"According to critics, sponge features…", opts:["never work in storms","require ongoing maintenance","are cheaper than all drains","harm street trees"], a:1, exp:"Paragraph 3: 'sponge features require maintenance: permeable surfaces clog… '"},
    {q:"Supporters claim sponge systems provide benefits that pipes do not, including…", opts:["faster internet","cleaner water and cooler streets","free electricity","taller buildings"], a:1, exp:"Final paragraph lists cleaner water, cooler streets, and habitat."}
   ]}
],
listening: [
 { id:"l1", title:"Listening Test 1 — At the Library Desk (conversation)", minutes:8, replay:true,
   script:"Woman: Excuse me, I reserved a book last week — 'The Design of Everyday Life' — but I can't find it on the hold shelf. Man: Let me check. Ah, I see the problem. The book was returned yesterday, but it was shelved in the general collection by mistake. Woman: Oh! So I can just go and get it? Man: Yes, it's on the third floor, in the psychology section. But hurry — another student reserved it this morning, so it can only be checked out for seven days instead of the usual month. Woman: Seven days is fine, I only need chapter four for my essay. Thank you!",
   questions:[
    {q:"Why did the woman come to the desk?", opts:["To renew a book","Because a reserved book was not where she expected","To reserve a classroom","To pay a fine"], a:1, exp:"She reserved the book but couldn't find it on the hold shelf."},
    {q:"Where was the book, in fact?", opts:["Lost","On the hold shelf","In the general collection on the third floor","In another library"], a:2, exp:"It was shelved in the general collection by mistake, third floor, psychology."},
    {q:"Why can she only borrow it for seven days?", opts:["It is a new book","Another student has reserved it","She has a fine","The library is closing"], a:1, exp:"Another student reserved it that morning."},
    {q:"What does the woman need the book for?", opts:["A group project","Chapter four, for her essay","Teaching a class","Leisure reading"], a:1, exp:"'I only need chapter four for my essay.'"},
    {q:"How does the woman feel at the end?", opts:["Annoyed","Confused","Satisfied — seven days is enough","Worried she cannot finish"], a:2, exp:"She says seven days is fine and thanks the man."}
   ]},
 { id:"l2", title:"Listening Test 2 — Why We Sleep (lecture)", minutes:9, replay:true,
   script:"Professor: Today let's ask a simple question scientists still argue about: why do we sleep? One leading idea is memory consolidation. While you sleep, especially during deep sleep, the brain replays experiences from the day and moves important information into long-term storage. Students who sleep after studying consistently remember more than students who stay up all night. A second idea concerns cleaning. During sleep, the spaces between brain cells widen, allowing fluid to wash away waste products that build up while we are awake. And a third idea is energy: sleep reduces energy use at the time of day when searching for food would be least successful anyway. Notice these ideas are not rivals — sleep probably does all three jobs at once.",
   questions:[
    {q:"What is the lecture mainly about?", opts:["How to study all night","Several explanations for why we sleep","The history of sleep research","Dreams and their meanings"], a:1, exp:"The professor presents three ideas about why we sleep."},
    {q:"According to the lecture, deep sleep helps students by…", opts:["cleaning their rooms","moving information into long-term storage","making them dream more","reducing homework"], a:1, exp:"Memory consolidation moves important information into long-term storage."},
    {q:"What happens to the spaces between brain cells during sleep?", opts:["They shrink","They disappear","They widen, allowing cleaning fluid through","They fill with air"], a:2, exp:"Spaces widen so fluid can wash away waste."},
    {q:"The professor says the three ideas are…", opts:["all wrong","not rivals — sleep likely does all three","only true for students","impossible to test"], a:1, exp:"'These ideas are not rivals — sleep probably does all three jobs at once.'"},
    {q:"Why might sleep save energy, according to the lecture?", opts:["Food is easier to find at night","Animals sleep when finding food would be least successful","Sleeping animals eat more","The brain uses no energy at night"], a:1, exp:"Sleep reduces energy use when searching for food would be least successful."}
   ]}
],
speaking: [
 { id:"s1", title:"Speaking Task 1 — A Skill Worth Learning", prep:15, seconds:45, prompt:"Describe a skill you would like to learn in the next year. Explain why this skill interests you and how you plan to learn it. Give specific details and examples." },
 { id:"s2", title:"Speaking Task 2 — Study Alone or in Groups?", prep:15, seconds:45, prompt:"Some students prefer to study alone, while others prefer to study in groups. Which do you prefer, and why? Use specific reasons and examples to support your answer." }
],
writing: [
 { id:"w1", title:"Writing Task 1 — Academic Discussion: Remote Work", minutes:20, minWords:100,
   prompt:"Your professor is teaching a class on business. Write a post responding to the professor's question, making a contribution to the discussion.\n\nProfessor: In the next two classes we will discuss whether companies should allow employees to work fully remotely. What is your view?\n\nClaire: Remote work saves commuting time and helps people focus. Companies should trust their employees.\n\nPaul: I disagree. Offices build teamwork and new employees learn faster in person.",
   source:"" },
 { id:"w2", title:"Writing Task 2 — Integrated: Urban Gardens", minutes:25, minWords:150,
   prompt:"Write an essay summarising the points in the reading passage and explaining how the lecture casts doubt on them.",
   source:"Reading: Urban gardens are often praised, but three problems are overlooked. First, city soil is frequently contaminated with lead and other metals, making home-grown food risky. Second, gardens require large amounts of water in precisely the cities that face shortages. Third, most garden plots are abandoned within five years, leaving neglected, weed-filled lots.\n\nLecture points (listen in Listening Test 2's class notes / ask your instructor): modern raised beds use clean imported soil; drip irrigation uses far less water than lawns; and community-managed plots with waiting lists remain active for decades." }
]
};
const SKILLS = ["reading","listening","speaking","writing"];
const SKILL_LABEL = {reading:"Reading", listening:"Listening", speaking:"Speaking", writing:"Writing"};
</script>
<script>
/* ================= Data layer ================= */
function loadDB(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const d = JSON.parse(raw); if(d && d.users) return d; } }catch(e){}
  return { users:[], classes:[], assignments:[], attempts:[], sessionUserId:null };
}
let DB = loadDB();
function saveDB(){ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
function me(){ return DB.users.find(u=>u.id===DB.sessionUserId) || null; }
function userById(id){ return DB.users.find(u=>u.id===id) || null; }
function myAttempts(){ const u=me(); return u ? DB.attempts.filter(a=>a.userId===u.id) : []; }
function classCode(){ let c; do{ c = Math.random().toString(36).slice(2,8).toUpperCase(); }while(DB.classes.some(x=>x.code===c)); return c; }

/* ================= Shell / routing ================= */
const app = document.getElementById("app");
function nav(){
  const u = me();
  const links = u
    ? '<a href="#/dashboard">Dashboard</a><a href="#/progress">Progress</a>' + (u.role==="instructor" ? '<a href="#/instructor">Instructor</a>' : '<a href="#/classes">My Classes</a>') + '<span class="hideS">'+esc(u.name)+' ('+esc(u.role)+')</span><a href="#/logout">Sign out</a>'
    : '<a href="#features">Features</a><a href="#skills">Practice sections</a><a href="#/signin">Sign in</a>';
  const cta = u ? '<a class="btn dark sm" href="#/dashboard">Go to dashboard</a>' : '<a class="btn dark sm" href="#/signup">Get Started</a>';
  return '<nav class="top"><div class="wrap navrow"><a class="logo" href="#/">Practice</a><div class="navlinks">'+links+cta+'</div></div></nav>';
}
function page(html){ app.innerHTML = nav() + '<main class="wrap">' + html + '</main>' + '<footer><div class="wrap row" style="justify-content:space-between"><span>© 2026 Practice</span><span><a href="#/privacy">Privacy</a> · <a href="#/terms">Terms</a></span></div></footer>'; window.scrollTo(0,0); }
function route(){
  const h = location.hash.replace(/^#\/?/, "");
  const [path, qs] = h.split("?");
  const q = new URLSearchParams(qs||"");
  const seg = path.split("/").filter(Boolean);
  if(seg[0]==="logout"){ DB.sessionUserId=null; saveDB(); location.hash="#/"; return; }
  if(!seg.length) return viewLanding();
  if(seg[0]==="signin") return viewAuth("in");
  if(seg[0]==="signup") return viewAuth("up");
  if(seg[0]==="privacy") return page('<section class="blk" style="border:none"><h2>Privacy</h2><p class="mut">Practice stores your account, attempts, recordings and writing so you and your instructor can review your progress. In this standalone build, data is stored only in this browser (localStorage). In a production deployment (see README), data is stored in your configured database and private storage, and is never sold. Contact your instructor to request deletion of your data.</p></section>');
  if(seg[0]==="terms") return page('<section class="blk" style="border:none"><h2>Terms</h2><p class="mut">Practice provides unofficial TOEFL preparation. Scores shown in Practice are practice estimates and rubric scores only — they are not official ETS TOEFL scores. Use the platform respectfully and do your own work on practice tests.</p></section>');
  const u = me();
  if(!u){ location.hash = "#/signin"; return; }
  if(seg[0]==="dashboard") return viewDashboard();
  if(seg[0]==="classes") return viewClasses();
  if(seg[0]==="instructor") return u.role==="instructor" ? viewInstructor() : viewDashboard();
  if(seg[0]==="review" && seg[1]) return viewReview(seg[1]);
  if(seg[0]==="progress") return viewProgress();
  if(seg[0]==="skill" && SKILLS.includes(seg[1])) return viewSkill(seg[1]);
  if(seg[0]==="test" && seg[1] && seg[2]) return viewTest(seg[1], seg[2], q);
  if(seg[0]==="result" && seg[1]) return viewResult(seg[1]);
  return page('<section class="blk" style="border:none"><h2>Page not found</h2><p class="mut">That page does not exist. <a href="#/dashboard">Go to your dashboard</a></p></section>');
}
window.addEventListener("hashchange", route);

/* ================= Landing ================= */
function viewLanding(){
  const u = me();
  const skillCards = SKILLS.map(s=>'<div class="card"><div class="tag">'+SKILL_LABEL[s]+'</div><h3 style="margin-top:8px">'+({reading:"Passages & questions",listening:"Real audio, real questions",speaking:"Record & get feedback",writing:"Write, save, improve"}[s])+'</h3><p class="mut small">'+({reading:"Original passages with vocabulary, inference and main-idea questions — timed or untimed, with explanations after you submit.",listening:"Listen to conversations and lectures with a working audio player, answer questions, and review explanations.",speaking:"Record your response in the browser, play it back, retry if allowed, and submit it for instructor review.",writing:"A clean editor with word count, autosaved drafts, timers, and rubric-based instructor feedback."}[s])+'</p></div>').join("");
  page(
   '<div class="hero"><h1>Prepare with purpose. Practice with confidence.</h1><p class="sub">Build your TOEFL skills with focused exercises, realistic practice tests, and progress tracking — all in one place.</p><div class="row"><a class="btn dark" href="'+(u?"#/dashboard":"#/signup")+'">Start Practicing</a><a class="btn" href="#skills">Explore the Platform</a></div>'
   + '<div class="preview"><div class="tag">Student dashboard — preview</div><div class="grid4" style="margin-top:14px"><div><div class="stat">4</div><p class="mut small">Skills to practise</p></div><div><div class="stat">9</div><p class="mut small">Seed tests included</p></div><div><div class="stat">Timed</div><p class="mut small">Real test conditions</p></div><div><div class="stat">Feedback</div><p class="mut small">From your instructor</p></div></div><p class="faint small" style="margin-top:12px">Sign up to see your own real statistics — Practice never shows fabricated scores.</p></div></div>'
   + '<section class="blk" id="skills"><h2>Four skills. One platform.</h2><p class="sub" style="margin-bottom:28px">Everything your class needs for TOEFL preparation.</p><div class="grid">'+skillCards+'</div></section>'
   + '<section class="blk" id="features"><h2>How Practice works</h2><div class="grid3"><div><h3>1. Join your class</h3><p class="mut small">Create an account and join with your instructor\u2019s class code.</p></div><div><h3>2. Practise &amp; take tests</h3><p class="mut small">Work through Reading, Listening, Speaking and Writing — timed tests save automatically and can be resumed.</p></div><div><h3>3. Review &amp; improve</h3><p class="mut small">See scores and explanations instantly for objective questions, and instructor feedback for Speaking and Writing.</p></div></div></section>'
   + '<section class="blk"><h2>Built for classrooms</h2><p class="sub" style="margin-bottom:0">Students practise and track their own progress. Instructors create classes, share a joining code, assign tests, review speaking recordings and writing, and publish feedback — all from one portal.</p></section>'
   + '<section class="blk"><h2>Ready when you are.</h2><div class="row"><a class="btn dark" href="'+(u?"#/dashboard":"#/signup")+'">Get Started</a></div></section>'
  );
  const el = document.getElementById("features"); if(location.hash==="#features" && el) el.scrollIntoView();
  const el2 = document.getElementById("skills"); if(location.hash==="#skills" && el2) el2.scrollIntoView();
}

/* ================= Auth ================= */
function viewAuth(mode){
  const isUp = mode==="up";
  page('<div class="authBox"><h2>'+(isUp?"Create your account":"Welcome back")+'</h2><p class="mut">'+(isUp?"Students and instructors both start here.":"Sign in to continue practising.")+'</p><div id="authErr"></div>'
   + '<form id="authForm">'
   + (isUp ? '<label for="aName">Full name</label><input id="aName" required autocomplete="name">' : '')
   + '<label for="aEmail">Email</label><input id="aEmail" type="email" required autocomplete="email">'
   + '<label for="aPw">Password</label><input id="aPw" type="password" required minlength="6" autocomplete="'+(isUp?"new-password":"current-password")+'">'
   + (isUp ? '<label for="aRole">I am a…</label><select id="aRole"><option value="student">Student</option><option value="instructor">Instructor</option></select><label for="aCode">Class code (students, optional — you can join later)</label><input id="aCode" placeholder="e.g. AB12CD" style="text-transform:uppercase">' : '')
   + '<div style="margin-top:20px"><button class="btn dark block" type="submit">'+(isUp?"Create account":"Sign in")+'</button></div></form>'
   + '<p class="mut small" style="margin-top:16px">'+(isUp?'Already have an account? <a href="#/signin">Sign in</a>':'New to Practice? <a href="#/signup">Create an account</a>')+'</p></div>');
  $("#authForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const email = $("#aEmail").value.trim().toLowerCase(), pw = $("#aPw").value;
    const err = m => { $("#authErr").innerHTML = '<div class="msg err" role="alert">'+esc(m)+'</div>'; };
    if(isUp){
      const name = $("#aName").value.trim(), role = $("#aRole").value, code = $("#aCode").value.trim().toUpperCase();
      if(DB.users.some(u=>u.email===email)) return err("An account with this email already exists. Sign in instead.");
      const salt = uid(); const user = { id:uid(), name, email, role, salt, passHash: await hashPw(pw, salt), createdAt: nowISO() };
      DB.users.push(user); DB.sessionUserId = user.id;
      if(code && role==="student"){
        const cls = DB.classes.find(c=>c.code===code);
        if(cls){ if(!cls.members.includes(user.id)) cls.members.push(user.id); }
        else { saveDB(); alert("Account created, but that class code was not found. You can join a class later from My Classes."); }
      }
      saveDB(); location.hash = "#/dashboard";
    } else {
      const user = DB.users.find(u=>u.email===email);
      if(!user) return err("No account found for this email.");
      if(user.passHash !== await hashPw(pw, user.salt)) return err("Incorrect password.");
      DB.sessionUserId = user.id; saveDB(); location.hash = "#/dashboard";
    }
  });
}
</script>
<script>
/* ================= Stats helpers ================= */
function skillStats(userId, skill){
  const atts = DB.attempts.filter(a=>a.userId===userId && a.skill===skill && a.status==="submitted");
  let pct = null;
  const scored = atts.filter(a=>typeof a.score==="number" && a.total);
  if(scored.length){ pct = Math.round(scored.reduce((s,a)=>s + (a.score/a.total*100),0)/scored.length); }
  const inProg = DB.attempts.find(a=>a.userId===userId && a.skill===skill && a.status==="in_progress");
  return { count: atts.length, pct, inProg };
}
function assignmentsFor(u){
  if(u.role!=="student") return [];
  const myClassIds = DB.classes.filter(c=>c.members.includes(u.id)).map(c=>c.id);
  return DB.assignments.filter(a=> myClassIds.includes(a.classId) && (a.studentIds.length===0 || a.studentIds.includes(u.id)));
}

/* ================= Dashboard ================= */
function viewDashboard(){
  const u = me(); const atts = myAttempts();
  const submitted = atts.filter(a=>a.status==="submitted");
  const cards = SKILLS.map(s=>{ const st = skillStats(u.id, s);
    return '<div class="card"><div class="tag">'+SKILL_LABEL[s]+'</div><div class="stat" style="margin-top:8px">'+(st.pct===null?"—":st.pct+"%")+'</div><p class="mut small">'+(st.count? st.count+" submitted attempt"+(st.count>1?"s":"") : "No attempts yet")+'</p>'+(st.pct!==null?'<div class="bar"><i style="width:'+st.pct+'%"></i></div>':"")+'<p style="margin-top:12px"><a class="btn sm" href="#/skill/'+s+'">'+(st.inProg?"Resume / practise":"Practise "+SKILL_LABEL[s])+'</a></p></div>'; }).join("");
  const recent = atts.slice().sort((a,b)=>(b.submittedAt||b.startedAt).localeCompare(a.submittedAt||a.startedAt)).slice(0,6);
  const recentHtml = recent.length ? '<table><tr><th>Test</th><th>Skill</th><th>Status</th><th>Score</th><th>When</th><th></th></tr>'+recent.map(a=>'<tr><td>'+esc(a.title)+'</td><td>'+SKILL_LABEL[a.skill]+'</td><td>'+(a.status==="submitted"?"Submitted":"In progress")+'</td><td>'+(a.status==="submitted" ? (typeof a.score==="number" ? a.score+" / "+a.total : "Awaiting review") : "—")+'</td><td class="small mut">'+fmtDate(a.submittedAt||a.startedAt)+'</td><td>'+(a.status==="submitted"?'<a href="#/result/'+a.id+'">Review</a>':'<a href="#/test/'+a.skill+'/'+a.testId+'">Resume</a>')+'</td></tr>').join("")+'</table>' : '<p class="mut">No activity yet. Pick a skill below and take your first practice test — your real progress will appear here.</p>';
  const assigns = assignmentsFor(u);
  const assignHtml = u.role==="student" ? '<section class="blk"><h2>Assigned to you</h2>'+(assigns.length ? assigns.map(a=>{ const t = (CONTENT[a.skill]||[]).find(x=>x.id===a.testId); const done = atts.some(x=>x.assignmentId===a.id && x.status==="submitted"); return '<div class="card" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><div><h3>'+esc(a.title)+'</h3><p class="mut small">'+SKILL_LABEL[a.skill]+(a.dueAt?" · Due "+fmtDate(a.dueAt):"")+(done?" · Submitted ✓":"")+'</p></div>'+(t?'<a class="btn sm dark" href="#/test/'+a.skill+'/'+a.testId+'?assignment='+a.id+'">Start</a>':"")+'</div></div>'; }).join("") : '<p class="mut">No assignments yet. When your instructor assigns a test, it will appear here.</p>')+'</section>' : "";
  const feedback = submitted.filter(a=>a.feedback).slice(-3).reverse();
  const fbHtml = feedback.length ? '<section class="blk"><h2>Recent instructor feedback</h2>'+feedback.map(a=>'<div class="card" style="margin-bottom:10px"><h3>'+esc(a.title)+'</h3><p class="mut small">'+(typeof a.rubricScore==="number" ? "Rubric score: "+a.rubricScore+" / 4 · " : "")+esc(a.feedback)+'</p><p><a href="#/result/'+a.id+'">View attempt</a></p></div>').join("")+'</section>' : "";
  page('<div style="padding:48px 0 8px"><h2 style="font-size:32px">Welcome, '+esc(u.name.split(" ")[0])+'</h2><p class="mut">Continue practising, or pick a skill to start something new.</p><p style="margin-top:14px"><a class="btn dark" href="#/skill/reading">Continue Practicing</a></p></div>'
   + '<section class="blk"><div class="grid4">'+cards+'</div></section>'
   + assignHtml + fbHtml
   + '<section class="blk"><h2>Recent activity</h2>'+recentHtml+'</section>');
}

/* ================= Classes (student) ================= */
function viewClasses(){
  const u = me();
  const mine = DB.classes.filter(c=>c.members.includes(u.id));
  page('<div style="padding:48px 0"><h2>My Classes</h2><p class="mut" style="margin-bottom:24px">Join a class with the code your instructor gave you.</p>'
   + '<div class="card" style="max-width:480px"><form id="joinForm"><label for="jCode">Class code</label><input id="jCode" required style="text-transform:uppercase" placeholder="AB12CD"><div style="margin-top:16px"><button class="btn dark" type="submit">Join class</button></div></form><div id="jMsg"></div></div>'
   + '<div style="margin-top:28px">' + (mine.length ? mine.map(c=>{ const ins = userById(c.instructorId); return '<div class="card" style="margin-bottom:10px"><h3>'+esc(c.name)+'</h3><p class="mut small">Instructor: '+esc(ins?ins.name:"—")+' · Code: '+esc(c.code)+'</p></div>'; }).join("") : '<p class="mut">You have not joined a class yet.</p>') + '</div></div>');
  $("#joinForm").addEventListener("submit", e=>{ e.preventDefault();
    const code = $("#jCode").value.trim().toUpperCase(); const cls = DB.classes.find(c=>c.code===code);
    if(!cls){ $("#jMsg").innerHTML = '<div class="msg err" style="margin-top:14px">That class code was not found.</div>'; return; }
    if(!cls.members.includes(u.id)) cls.members.push(u.id); saveDB(); viewClasses();
  });
}

/* ================= Skill home ================= */
function viewSkill(skill){
  const u = me(); const tests = CONTENT[skill];
  const rows = tests.map(t=>{ const atts = myAttempts().filter(a=>a.testId===t.id);
    const done = atts.filter(a=>a.status==="submitted"); const inProg = atts.find(a=>a.status==="in_progress");
    const best = done.filter(a=>typeof a.score==="number").sort((a,b)=>(b.score/b.total)-(a.score/a.total))[0];
    return '<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><div><h3>'+esc(t.title)+'</h3><p class="mut small">'+(skill==="reading"||skill==="listening" ? t.questions.length+" questions · "+t.minutes+" min timed" : skill==="speaking" ? "Respond in "+t.seconds+"s · "+t.prep+"s preparation" : t.minutes+" min · at least "+t.minWords+" words")+(best?" · Best: "+best.score+"/"+best.total:"")+(inProg?" · Attempt in progress":"")+'</p></div><a class="btn sm '+(inProg?"":"dark")+'" href="#/test/'+skill+'/'+t.id+'">'+(inProg?"Resume":"Start")+'</a></div></div>'; }).join("");
  page('<div style="padding:48px 0"><div class="tag">'+SKILL_LABEL[skill]+'</div><h2 style="margin-top:6px">'+SKILL_LABEL[skill]+' Practice</h2><p class="mut" style="margin-bottom:26px">'+({reading:"Read the passage and answer every question. You can practise untimed or start the timer.",listening:"Press play and listen — the player uses your device\u2019s speech voice to read the audio script aloud. Practice mode allows replay.",speaking:"Record your answer with your microphone, listen back, retry if you like, then submit for instructor review.",writing:"Write in a clean editor. Drafts autosave to this device; submit when you are ready for feedback."}[skill])+'</p>'+rows+'</div>');
}
</script>
<script>
/* ================= Test engine (shared) ================= */
let timerHandle = null;
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle = null; } }
function getOrCreateAttempt(skill, test, assignmentId){
  const u = me();
  let a = DB.attempts.find(x=>x.userId===u.id && x.testId===test.id && x.status==="in_progress" && (assignmentId ? x.assignmentId===assignmentId : !x.assignmentId));
  if(!a){
    a = { id:uid(), userId:u.id, skill, testId:test.id, title:test.title, assignmentId:assignmentId||null,
          status:"in_progress", answers:{}, writingText:"", recording:null,
          startedAt: nowISO(), deadlineAt: test.minutes ? new Date(Date.now()+test.minutes*60000).toISOString() : null,
          submittedAt:null, score:null, total: test.questions ? test.questions.length : 4, feedback:"", rubricScore:null };
    DB.attempts.push(a); saveDB();
  }
  return a;
}
function startTimer(attempt, onExpire){
  stopTimer();
  const el = document.getElementById("timerEl"); if(!el || !attempt.deadlineAt) return;
  const tick = ()=>{
    const left = new Date(attempt.deadlineAt).getTime() - Date.now();
    if(left <= 0){ el.textContent = "0:00"; stopTimer(); onExpire && onExpire(); return; }
    const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
    el.textContent = m + ":" + String(s).padStart(2,"0");
  };
  tick(); timerHandle = setInterval(tick, 500);
}
function scoreObjective(test, answers){
  let score = 0; test.questions.forEach((q,i)=>{ if(Number(answers[i]) === q.a) score++; }); return score;
}
function submitAttempt(attempt, test){
  if(attempt.status==="submitted") return;
  if(test.questions) { attempt.score = scoreObjective(test, attempt.answers); attempt.total = test.questions.length; }
  attempt.status = "submitted"; attempt.submittedAt = nowISO(); stopTimer(); saveDB();
  location.hash = "#/result/" + attempt.id;
}
function confirmSubmit(attempt, test){
  const unanswered = test.questions ? test.questions.filter((q,i)=>attempt.answers[i]===undefined).length : 0;
  const bg = document.createElement("div"); bg.className = "modalBg";
  bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h3>Submit this test?</h3><p class="mut">'+(unanswered? unanswered+" question(s) are still unanswered. " : "All questions are answered. ")+'You will see your score and explanations after submitting.</p><div class="row" style="margin-top:20px"><button class="btn dark" id="mYes">Submit</button><button class="btn" id="mNo">Keep working</button></div></div>';
  document.body.appendChild(bg);
  bg.querySelector("#mNo").onclick = ()=> bg.remove();
  bg.querySelector("#mYes").onclick = ()=>{ bg.remove(); submitAttempt(attempt, test); };
}

function viewTest(skill, testId, q){
  stopTimer();
  const test = (CONTENT[skill]||[]).find(t=>t.id===testId);
  if(!test){ location.hash = "#/dashboard"; return; }
  const assignmentId = q.get("assignment");
  const attempt = getOrCreateAttempt(skill, test, assignmentId);
  if(skill==="reading" || skill==="listening") return viewObjectiveTest(skill, test, attempt);
  if(skill==="speaking") return viewSpeaking(skill, test, attempt);
  if(skill==="writing") return viewWriting(skill, test, attempt);
}

/* ---- Reading & Listening (objective) ---- */
function viewObjectiveTest(skill, test, attempt){
  const isL = skill==="listening";
  let cur = 0;
  const leftHtml = isL
    ? '<div class="card"><h3>Audio</h3><p class="mut small">Press play to hear the '+(test.id==="l1"?"conversation":"lecture")+'. '+(test.replay?"Practice mode: replay is allowed.":"")+'</p><div class="row" style="margin-top:12px"><button class="btn dark sm" id="playBtn" type="button">▶ Play audio</button><button class="btn sm" id="stopBtn" type="button">Stop</button></div><p class="small faint" id="audioState" style="margin-top:10px">Audio is read aloud by your device\u2019s speech voice. If no voice is available, ask your instructor for the audio file.</p><details style="margin-top:14px"><summary class="small">Show transcript (practice aid)</summary><p class="small mut" style="margin-top:8px">'+esc(test.script)+'</p></details></div>'
    : '<div class="card"><h3>Passage</h3><div class="passage">'+esc(test.passage)+'</div></div>';
  page('<div style="padding:32px 0"><div class="row" style="justify-content:space-between"><div><div class="tag">'+SKILL_LABEL[skill]+' · Timed</div><h2 style="margin-top:4px">'+esc(test.title)+'</h2></div><div class="timer" id="timerEl" aria-live="polite"></div></div>'
   + '<div class="split" style="margin-top:20px"><div>'+leftHtml+'</div><div><div id="qArea"></div><div class="qnav" id="qNav" style="margin:16px 0"></div><div class="row"><button class="btn" id="prevBtn" type="button">← Previous</button><button class="btn" id="nextBtn" type="button">Next →</button><button class="btn dark" id="submitBtn" type="button">Submit test</button></div><p class="small faint" style="margin-top:10px">Answers save automatically on this device. Time left is shown above; the test submits itself when time runs out.</p></div></div></div>');
  function renderQ(){
    const q = test.questions[cur];
    $("#qArea").innerHTML = '<div class="qbox"><div class="tag">Question '+(cur+1)+' of '+test.questions.length+'</div><h3 style="margin-top:8px">'+esc(q.q)+'</h3>'+ q.opts.map((o,i)=>'<label class="opt'+(Number(attempt.answers[cur])===i?" sel":"")+'"><input type="radio" name="opt" value="'+i+'"'+(Number(attempt.answers[cur])===i?" checked":"")+'> <span>'+esc(o)+'</span></label>').join("") + '</div>';
    $$("#qArea input[name=opt]").forEach(inp=> inp.addEventListener("change", ()=>{ attempt.answers[cur] = Number(inp.value); saveDB(); renderQ(); }));
    $("#qNav").innerHTML = test.questions.map((qq,i)=>'<button type="button" data-i="'+i+'" class="'+(attempt.answers[i]!==undefined?"done":"")+(i===cur?" cur":"")+'">'+(i+1)+'</button>').join("");
    $$("#qNav button").forEach(b=> b.addEventListener("click", ()=>{ cur = Number(b.dataset.i); renderQ(); }));
    $("#prevBtn").disabled = cur===0; $("#nextBtn").disabled = cur===test.questions.length-1;
  }
  renderQ();
  $("#prevBtn").addEventListener("click", ()=>{ if(cur>0){ cur--; renderQ(); }});
  $("#nextBtn").addEventListener("click", ()=>{ if(cur<test.questions.length-1){ cur++; renderQ(); }});
  $("#submitBtn").addEventListener("click", ()=> confirmSubmit(attempt, test));
  startTimer(attempt, ()=> submitAttempt(attempt, test));
  if(isL){
    const state = $("#audioState");
    $("#playBtn").addEventListener("click", ()=>{
      if(!("speechSynthesis" in window)){ state.textContent = "Speech is not supported in this browser — ask your instructor for the audio file."; return; }
      speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(test.script); utt.rate = 0.95;
      utt.onend = ()=> state.textContent = "Playback finished. You may replay in practice mode.";
      state.textContent = "Playing…"; speechSynthesis.speak(utt);
    });
    $("#stopBtn").addEventListener("click", ()=>{ if("speechSynthesis" in window) speechSynthesis.cancel(); state.textContent = "Playback stopped."; });
  }
}

/* ---- Speaking ---- */
function viewSpeaking(skill, test, attempt){
  page('<div style="padding:32px 0;max-width:760px"><div class="tag">Speaking · Response '+test.seconds+'s</div><h2 style="margin-top:4px">'+esc(test.title)+'</h2>'
   + '<div class="qbox"><h3>Prompt</h3><p>'+esc(test.prompt)+'</p><p class="small mut" style="margin-top:8px">Preparation time: '+test.prep+' seconds. Your microphone is used only when you press Record, and your recording is stored on this device for your instructor to review.</p></div>'
   + '<div class="card"><div class="row"><button class="btn dark" id="recBtn" type="button">● Record</button><button class="btn" id="stopRecBtn" type="button" disabled>Stop</button><span class="timer" id="recTime">0:00</span><span class="small mut" id="recState" role="status">Not recorded yet</span></div>'
   + '<div style="margin-top:14px"><audio id="playBack" controls style="width:100%"></audio></div>'
   + '<div class="row" style="margin-top:16px"><button class="btn dark" id="subSpeak" type="button" disabled>Submit recording</button></div>'
   + '<p class="small faint" style="margin-top:10px">Automated speech evaluation is not configured for this build, so your recording is submitted for instructor review. Practice never presents a fake AI score.</p><div id="speakErr"></div></div></div>');
  let mediaRec = null, chunks = [], recTimer = null, recStart = 0;
  const recBtn = $("#recBtn"), stopBtn = $("#stopRecBtn"), subBtn = $("#subSpeak"), audioEl = $("#playBack"), stateEl = $("#recState");
  if(attempt.recording){ audioEl.src = attempt.recording; subBtn.disabled = false; stateEl.textContent = "A recording is saved — you can re-record to replace it."; }
  recBtn.addEventListener("click", async ()=>{
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      chunks = []; mediaRec = new MediaRecorder(stream);
      mediaRec.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
      mediaRec.onstop = ()=>{
        stream.getTracks().forEach(t=>t.stop()); clearInterval(recTimer);
        const blob = new Blob(chunks, { type: mediaRec.mimeType || "audio/webm" });
        const rd = new FileReader();
        rd.onload = ()=>{ attempt.recording = rd.result; saveDB(); audioEl.src = attempt.recording; subBtn.disabled = false; stateEl.textContent = "Recorded. Listen back, re-record, or submit."; };
        rd.readAsDataURL(blob);
      };
      mediaRec.start(); recStart = Date.now();
      stateEl.textContent = "Recording…"; recBtn.disabled = true; stopBtn.disabled = false;
      recTimer = setInterval(()=>{ const s = Math.floor((Date.now()-recStart)/1000); $("#recTime").textContent = Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); if(s >= test.seconds){ stopBtn.click(); } }, 250);
    }catch(err){
      $("#speakErr").innerHTML = '<div class="msg err" style="margin-top:12px">Microphone access was denied or is unavailable in this browser. Check your browser permission settings, or ask your instructor how to submit this task.</div>';
    }
  });
  stopBtn.addEventListener("click", ()=>{ if(mediaRec && mediaRec.state!=="inactive") mediaRec.stop(); recBtn.disabled = false; stopBtn.disabled = true; });
  subBtn.addEventListener("click", ()=>{ if(!attempt.recording) return; attempt.score = null; submitAttempt(attempt, test); });
}

/* ---- Writing ---- */
function viewWriting(skill, test, attempt){
  page('<div style="padding:32px 0;max-width:820px"><div class="row" style="justify-content:space-between"><div><div class="tag">Writing · '+test.minutes+' min</div><h2 style="margin-top:4px">'+esc(test.title)+'</h2></div><div class="timer" id="timerEl" aria-live="polite"></div></div>'
   + '<div class="qbox"><h3>Prompt</h3><p style="white-space:pre-wrap">'+esc(test.prompt)+'</p>'+(test.source?'<h3 style="margin-top:16px">Source material</h3><p style="white-space:pre-wrap" class="mut">'+esc(test.source)+'</p>':"")+'</div>'
   + '<label for="wText">Your response <span class="faint">(drafts autosave on this device)</span></label><textarea id="wText" rows="14" placeholder="Write your response here…">'+esc(attempt.writingText||"")+'</textarea>'
   + '<div class="row" style="justify-content:space-between;margin-top:10px"><span class="small mut"><span id="wCount">0</span> words · suggested minimum '+test.minWords+'</span><span class="small faint" id="wSaved"></span></div>'
   + '<div class="row" style="margin-top:16px"><button class="btn dark" id="subWrite" type="button">Submit for review</button></div>'
   + '<p class="small faint" style="margin-top:10px">AI writing feedback is not configured for this build, so submissions go to your instructor for rubric feedback. Your score will never be presented as an official TOEFL score.</p></div>');
  const ta = $("#wText");
  const upd = ()=>{ const words = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0; $("#wCount").textContent = words; };
  upd();
  ta.addEventListener("input", ()=>{ attempt.writingText = ta.value; saveDB(); upd(); $("#wSaved").textContent = "Draft saved " + new Date().toLocaleTimeString(); });
  $("#subWrite").addEventListener("click", ()=>{
    if(!ta.value.trim()){ alert("Write something before submitting."); return; }
    if(confirm("Submit this response for instructor review?")){ attempt.writingText = ta.value; attempt.score = null; submitAttempt(attempt, test); }
  });
  startTimer(attempt, ()=>{ attempt.writingText = ta.value; submitAttempt(attempt, test); });
}
</script>
<script>
/* ================= Result & review ================= */
function viewResult(attemptId){
  const u = me(); const a = DB.attempts.find(x=>x.id===attemptId);
  if(!a || (a.userId!==u.id && u.role!=="instructor")){ page('<section class="blk" style="border:none"><h2>Not available</h2><p class="mut">You do not have access to this attempt.</p></section>'); return; }
  const test = (CONTENT[a.skill]||[]).find(t=>t.id===a.testId);
  let body = "";
  if(test && test.questions){
    body = '<div class="card" style="margin-bottom:20px"><div class="tag">Score</div><div class="stat">'+a.score+' / '+a.total+'</div><div class="bar"><i style="width:'+Math.round(a.score/a.total*100)+'%"></i></div></div>'
     + test.questions.map((q,i)=>{ const mine = a.answers[i]; const ok = Number(mine)===q.a; return '<div class="qbox"><div class="tag">Question '+(i+1)+' — '+(ok?"Correct":"Not correct")+'</div><h3 style="margin-top:6px">'+esc(q.q)+'</h3>'+ q.opts.map((o,j)=>'<div class="opt'+(j===q.a?" correct":(Number(mine)===j?" wrong":""))+'"><span>'+esc(o)+(j===q.a?" ✓":"")+'</span></div>').join("") + '<div class="expl"><strong>Explanation:</strong> '+esc(q.exp)+'</div></div>'; }).join("");
  } else if(a.skill==="speaking"){
    body = '<div class="card"><h3>Your recording</h3>'+(a.recording?'<audio controls src="'+a.recording+'" style="width:100%"></audio>':'<p class="mut">No recording was stored with this attempt.</p>')+'<p class="mut small" style="margin-top:10px">'+(a.feedback? "Instructor feedback below." : "Status: awaiting instructor review. Automated evaluation is not configured.")+'</p></div>';
  } else if(a.skill==="writing"){
    body = '<div class="card"><h3>Your response</h3><p style="white-space:pre-wrap">'+esc(a.writingText||"")+'</p><p class="mut small" style="margin-top:10px">'+(a.writingText? a.writingText.trim().split(/\s+/).length : 0)+' words · '+(a.feedback? "Reviewed — feedback below." : "Status: awaiting instructor review.")+'</p></div>';
  }
  const fb = a.feedback ? '<div class="card" style="margin-top:16px"><div class="tag">Instructor feedback</div>'+(typeof a.rubricScore==="number"?'<p style="margin-top:8px"><strong>Rubric score: '+a.rubricScore+' / 4</strong></p>':"")+'<p style="margin-top:6px">'+esc(a.feedback)+'</p></div>' : "";
  page('<div style="padding:40px 0"><div class="tag">'+SKILL_LABEL[a.skill]+' · Submitted '+fmtDate(a.submittedAt)+'</div><h2 style="margin-top:4px">'+esc(a.title)+'</h2><div style="margin-top:20px">'+body+fb+'</div><p style="margin-top:22px" class="row"><a class="btn" href="#/skill/'+a.skill+'">Back to '+SKILL_LABEL[a.skill]+'</a><a class="btn" href="#/dashboard">Dashboard</a>'+(u.role==="instructor" && a.userId!==u.id ? '<a class="btn dark" href="#/review/'+a.id+'">Review this attempt</a>' : "")+'</p></div>');
}

/* ================= Progress ================= */
function viewProgress(){
  const u = me(); const atts = myAttempts().filter(a=>a.status==="submitted").sort((a,b)=>(a.submittedAt||"").localeCompare(b.submittedAt||""));
  const skillRows = SKILLS.map(s=>{ const st = skillStats(u.id, s); return '<div class="card"><div class="tag">'+SKILL_LABEL[s]+'</div><div class="stat" style="margin-top:6px">'+(st.pct===null?"—":st.pct+"%")+'</div><p class="mut small">'+st.count+' submitted</p>'+(st.pct!==null?'<div class="bar"><i style="width:'+st.pct+'%"></i></div>':"")+'</div>'; }).join("");
  const rubric = atts.filter(a=>typeof a.rubricScore==="number");
  const history = atts.length ? '<table><tr><th>Date</th><th>Test</th><th>Skill</th><th>Result</th></tr>'+atts.slice().reverse().map(a=>'<tr><td class="small">'+fmtDate(a.submittedAt)+'</td><td><a href="#/result/'+a.id+'">'+esc(a.title)+'</a></td><td>'+SKILL_LABEL[a.skill]+'</td><td>'+(typeof a.score==="number"? a.score+" / "+a.total : (typeof a.rubricScore==="number" ? "Rubric "+a.rubricScore+" / 4" : "Awaiting review"))+'</td></tr>').join("")+'</table>' : '<p class="mut">No submitted attempts yet — your history will appear here after your first test.</p>';
  const trend = atts.filter(a=>typeof a.score==="number" && a.total).map(a=>'<div style="margin-bottom:8px"><div class="row" style="justify-content:space-between"><span class="small">'+esc(a.title)+'</span><span class="small mut">'+Math.round(a.score/a.total*100)+'%</span></div><div class="bar"><i style="width:'+Math.round(a.score/a.total*100)+'%"></i></div></div>').join("");
  page('<div style="padding:48px 0"><h2>Your progress</h2><p class="mut" style="margin-bottom:26px">Calculated from your actual submitted attempts'+(rubric.length? " — including "+rubric.length+" instructor-scored response(s).":"")+' Practice scores are unofficial and are not ETS TOEFL scores.</p><div class="grid4">'+skillRows+'</div>'+(trend?'<section class="blk"><h3>Objective scores over time</h3>'+trend+'</section>':"")+'<section class="blk"><h3>Attempt history</h3>'+history+'</section></div>');
}

/* ================= Instructor ================= */
function viewInstructor(){
  const u = me();
  const myClasses = DB.classes.filter(c=>c.instructorId===u.id);
  const classCards = myClasses.length ? myClasses.map(c=>{
    const members = c.members.map(userById).filter(Boolean);
    const assigns = DB.assignments.filter(a=>a.classId===c.id);
    return '<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><div><h3>'+esc(c.name)+'</h3><p class="mut small">Join code: <strong>'+esc(c.code)+'</strong> · '+members.length+' student(s)</p></div><button class="btn sm" data-regen="'+c.id+'" type="button">Regenerate code</button></div>'
     + (members.length? '<table style="margin-top:12px"><tr><th>Student</th><th>Attempts</th><th>Avg objective</th></tr>'+members.map(m=>{ const ma = DB.attempts.filter(a=>a.userId===m.id && a.status==="submitted"); const sc = ma.filter(a=>typeof a.score==="number" && a.total); const avg = sc.length? Math.round(sc.reduce((s,a)=>s+a.score/a.total*100,0)/sc.length)+"%" : "—"; return '<tr><td>'+esc(m.name)+'<br><span class="faint small">'+esc(m.email)+'</span></td><td>'+ma.length+'</td><td>'+avg+'</td></tr>'; }).join("")+'</table>' : '<p class="mut small" style="margin-top:8px">No students have joined yet. Share the code above.</p>')
     + '<form data-assign="'+c.id+'" style="margin-top:16px;border-top:1px solid #eee;padding-top:14px"><div class="tag">New assignment</div><div class="grid3" style="margin-top:10px"><select name="skill">'+SKILLS.map(s=>'<option value="'+s+'">'+SKILL_LABEL[s]+'</option>').join("")+'</select><select name="testId"></select><input name="due" type="datetime-local" aria-label="Due date (optional)"></div><div style="margin-top:10px"><button class="btn sm dark" type="submit">Assign to whole class</button></div></form>'
     + (assigns.length? '<p class="small mut" style="margin-top:12px">Assignments: '+assigns.map(a=>esc(a.title)+(a.dueAt?" (due "+fmtDate(a.dueAt)+")":"")).join(" · ")+'</p>' : "")
     + '</div>'; }).join("") : '<p class="mut">No classes yet. Create your first class below.</p>';
  const memberIds = new Set(myClasses.flatMap(c=>c.members));
  const submissions = DB.attempts.filter(a=>a.status==="submitted" && memberIds.has(a.userId)).sort((a,b)=>(b.submittedAt||"").localeCompare(a.submittedAt||""));
  const subHtml = submissions.length ? '<table><tr><th>Student</th><th>Test</th><th>Score / status</th><th>Submitted</th><th></th></tr>'+submissions.map(a=>{ const st = userById(a.userId); return '<tr><td>'+esc(st?st.name:"—")+'</td><td>'+esc(a.title)+'</td><td>'+(typeof a.score==="number" ? a.score+" / "+a.total : (a.feedback? "Reviewed · rubric "+a.rubricScore+"/4" : "Needs review"))+'</td><td class="small mut">'+fmtDate(a.submittedAt)+'</td><td><a href="#/review/'+a.id+'">Review</a></td></tr>'; }).join("")+'</table>' : '<p class="mut">No submissions from your students yet.</p>';
  page('<div style="padding:48px 0"><h2>Instructor portal</h2><p class="mut" style="margin-bottom:24px">Create classes, assign tests, and review your students\u2019 work.</p>'
   + '<div class="card" style="max-width:520px;margin-bottom:28px"><h3>Create a class</h3><form id="newClass"><label for="cName">Class name</label><input id="cName" required placeholder="e.g. TOEFL — Fall Class A"><div style="margin-top:14px"><button class="btn dark" type="submit">Create class &amp; get join code</button></div></form></div>'
   + classCards
   + '<section class="blk"><h3>Student submissions</h3>'+subHtml+'</section></div>');
  $("#newClass").addEventListener("submit", e=>{ e.preventDefault(); const name = $("#cName").value.trim(); if(!name) return;
    DB.classes.push({ id:uid(), name, code: classCode(), instructorId: u.id, members: [], createdAt: nowISO() }); saveDB(); viewInstructor(); });
  $$("[data-regen]").forEach(b=> b.addEventListener("click", ()=>{ const c = DB.classes.find(x=>x.id===b.dataset.regen); if(c && confirm("Regenerate this class code? The old code will stop working for new joins.")){ c.code = classCode(); saveDB(); viewInstructor(); } }));
  $$("[data-assign]").forEach(f=>{
    const skillSel = f.querySelector('[name=skill]'), testSel = f.querySelector('[name=testId]');
    const fill = ()=>{ testSel.innerHTML = CONTENT[skillSel.value].map(t=>'<option value="'+t.id+'">'+esc(t.title)+'</option>').join(""); };
    fill(); skillSel.addEventListener("change", fill);
    f.addEventListener("submit", e=>{ e.preventDefault(); const skill = skillSel.value, test = CONTENT[skill].find(t=>t.id===testSel.value); const due = f.querySelector('[name=due]').value;
      DB.assignments.push({ id:uid(), classId: f.dataset.assign, skill, testId: test.id, title: test.title, studentIds: [], dueAt: due ? new Date(due).toISOString() : null, createdAt: nowISO() }); saveDB(); viewInstructor(); });
  });
}
function viewReview(attemptId){
  const u = me(); if(u.role!=="instructor"){ location.hash="#/dashboard"; return; }
  const a = DB.attempts.find(x=>x.id===attemptId); if(!a){ location.hash="#/instructor"; return; }
  const st = userById(a.userId);
  const myClassIds = DB.classes.filter(c=>c.instructorId===u.id).map(c=>c.id);
  const allowed = DB.classes.some(c=>c.instructorId===u.id && c.members.includes(a.userId));
  if(!allowed){ page('<section class="blk" style="border:none"><h2>Not your student</h2><p class="mut">You can only review attempts from students in your classes.</p></section>'); return; }
  page('<div style="padding:40px 0;max-width:820px"><div class="tag">Instructor review</div><h2 style="margin-top:4px">'+esc(a.title)+'</h2><p class="mut">'+esc(st?st.name:"")+' · '+SKILL_LABEL[a.skill]+' · Submitted '+fmtDate(a.submittedAt)+'</p>'
   + '<div style="margin:20px 0">'+(a.skill==="speaking" && a.recording ? '<div class="card"><h3>Recording</h3><audio controls src="'+a.recording+'" style="width:100%"></audio></div>' : "")+(a.skill==="writing" ? '<div class="card"><h3>Response</h3><p style="white-space:pre-wrap">'+esc(a.writingText||"")+'</p></div>' : "")+(typeof a.score==="number" ? '<div class="card"><h3>Objective score</h3><p>'+a.score+' / '+a.total+' (auto-scored)</p><p><a href="#/result/'+a.id+'">See full answer review</a></p></div>' : "")+'</div>'
   + '<div class="card"><h3>Feedback &amp; rubric score</h3><form id="fbForm"><label for="fbScore">Rubric score (0–4, for Speaking/Writing)</label><select id="fbScore"><option value="">— none —</option>'+[0,1,2,3,4].map(n=>'<option value="'+n+'"'+(a.rubricScore===n?" selected":"")+'>'+n+'</option>').join("")+'</select><label for="fbText">Written feedback</label><textarea id="fbText" rows="5" placeholder="Strengths, areas to improve, next steps…">'+esc(a.feedback||"")+'</textarea><div style="margin-top:16px"><button class="btn dark" type="submit">Publish feedback to student</button></div></form></div></div>');
  $("#fbForm").addEventListener("submit", e=>{ e.preventDefault(); const v = $("#fbScore").value; a.rubricScore = v===""? null : Number(v); a.feedback = $("#fbText").value.trim(); saveDB(); alert("Feedback published. The student will see it on their dashboard and attempt page."); location.hash = "#/instructor"; });
}

route();
</script>
</body>
</html>
