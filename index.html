<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice — TOEFL Practice, No Sign-Up</title>
<meta name="description" content="Practice TOEFL Reading, Listening, Speaking and Writing — open the site and start practicing. No account needed.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#111;--mut:#666;--faint:#999;--line:#e5e5e5;--soft:#f7f7f7}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#111;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit} button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:15px;padding:11px 14px;border:1px solid #d5d5d5;border-radius:6px;width:100%;background:#fff;color:#111}
input:focus,textarea:focus{outline:2px solid #111;outline-offset:1px;border-color:#111}
.wrap{max-width:1020px;margin:0 auto;padding:0 24px}
.btn{display:inline-block;padding:11px 20px;border:1px solid #111;border-radius:6px;font-weight:500;font-size:14px;background:#fff;color:#111;text-decoration:none;text-align:center}
.btn.dark{background:#111;color:#fff}.btn.sm{padding:7px 14px;font-size:13px}.btn:disabled{opacity:.4;cursor:not-allowed}
nav.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:20}
.navrow{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.logo{font-weight:700;font-size:18px;text-decoration:none}
.navlinks{display:flex;gap:20px;align-items:center;font-size:14px;color:var(--mut);flex-wrap:wrap}
.navlinks a{text-decoration:none}.navlinks a:hover{color:#111}
.hero{padding:84px 0 64px}
h1{font-size:clamp(36px,5.6vw,58px);line-height:1.1;letter-spacing:-.03em;font-weight:700;max-width:720px;margin-bottom:18px}
h2{font-size:27px;letter-spacing:-.02em;margin-bottom:10px}
h3{font-size:17px;margin-bottom:6px}
.sub{font-size:18px;color:var(--mut);max-width:560px;margin-bottom:30px}
.mut{color:var(--mut)}.small{font-size:13px}.faint{color:var(--faint)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
section.blk{padding:64px 0;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:860px){.grid3{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:8px;padding:22px;background:#fff}
.tag{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#111}
.preview{border:1px solid var(--line);border-radius:8px;padding:22px;margin-top:48px;background:var(--soft)}
.msg{border:1px solid var(--line);border-radius:6px;padding:14px 18px;margin-bottom:12px;font-size:14px;background:#fff}
.qbox{border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:16px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #ddd;border-radius:6px;padding:11px 14px;margin-top:8px;cursor:pointer;font-size:15px}
.opt:hover{border-color:#111}.opt.sel{border-color:#111;background:var(--soft)}
.opt input{width:auto;margin-top:4px}
.opt.correct{border-color:#111;background:#e9e9e9}.opt.wrong{border-color:#999;text-decoration:line-through}
.passage{white-space:pre-wrap;font-size:16px;line-height:1.75}
.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.qnav{display:flex;gap:6px;flex-wrap:wrap}
.qnav button{width:34px;height:34px;border:1px solid #ccc;border-radius:6px;background:#fff;font-size:13px}
.qnav button.done{background:#111;color:#fff;border-color:#111}
.qnav button.cur{outline:2px solid #111}
.expl{font-size:14px;color:#444;background:var(--soft);border-radius:6px;padding:10px 14px;margin-top:10px}
.stat{font-size:32px;font-weight:700;letter-spacing:-.02em}
footer{padding:36px 0;border-top:1px solid var(--line);color:var(--faint);font-size:13px;margin-top:40px}
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:8px;padding:28px;max-width:440px;width:100%}
:focus-visible{outline:2px solid #111;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const LS_KEY = "practice_simple_v1";
const $ = (s, el) => (el||document).querySelector(s);
const $$ = (s, el) => Array.from((el||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return "—"; return new Date(iso).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}); }
</script>
<script>
/* ============ Seed content (all original) ============ */
const CONTENT = {
reading: [
 { id:"r1", title:"Reading Test 1 — The Honeybee's Compass", minutes:12,
   passage:"Honeybees perform one of nature's most remarkable feats of communication. When a scout bee discovers a rich source of nectar, she returns to the hive and performs a 'waggle dance' on the vertical surface of the honeycomb. The angle of her dance relative to gravity communicates the direction of the flowers relative to the sun, while the duration of the waggle tells her sisters how far they must fly.\n\nFor decades, scientists assumed the dance was the whole story. Recent research, however, suggests that follower bees also pick up faint sounds and air currents produced during the dance, which may help them interpret its message in the darkness of the hive. Moreover, experienced foragers appear to combine the dance's information with their own memories of the landscape, sometimes ignoring directions that conflict with landmarks they already know.\n\nThis combination of shared information and private experience makes the colony flexible. On cloudy days, when the sun is hidden, dances become less precise, yet colonies still forage successfully because veteran bees rely more heavily on memory. The system, in other words, degrades gracefully rather than failing all at once.",
   questions:[
    {q:"What is the passage mainly about?", opts:["How honeybees build honeycombs","How honeybees communicate the location of food","Why scout bees collect nectar","How bees see the sun on cloudy days"], a:1, exp:"The whole passage explains the waggle dance and how bees use it — plus memory — to find food."},
    {q:"According to the passage, the duration of the waggle indicates…", opts:["the quality of the nectar","the number of flowers","the distance to the flowers","the direction of the hive"], a:2, exp:"Paragraph 1: angle gives direction; duration gives distance."},
    {q:"The word 'veteran' in paragraph 3 is closest in meaning to…", opts:["injured","experienced","young","tired"], a:1, exp:"'Veteran bees rely on memory' = bees with experience."},
    {q:"Why does the author mention cloudy days?", opts:["To show the system still works when one information source is weaker","To prove bees cannot fly in bad weather","To explain why hives are dark","To describe a different kind of dance"], a:0, exp:"Cloudy days show the system 'degrades gracefully' because bees fall back on memory."},
    {q:"Which statement is true according to the passage?", opts:["Bees follow dances blindly, ignoring their own knowledge","Sound and air currents may help bees interpret the dance","Only scout bees ever leave the hive","The dance works only on sunny mornings"], a:1, exp:"Paragraph 2 notes sounds and air currents may help followers interpret the dance."}
   ]},
 { id:"r2", title:"Reading Test 2 — Cities That Drink the Rain", minutes:12,
   passage:"For most of modern history, city engineers treated rain as a problem to be removed. Storm drains carried water away as quickly as possible, into rivers and seas. The result, paradoxically, was both flooding and thirst: streets flooded during storms because drains were overwhelmed, while groundwater slowly fell because rain never soaked into the earth.\n\n'Sponge cities' reverse this logic. Instead of sealing the ground with concrete, they use permeable pavements, planted rooftops, wetlands, and sunken gardens that absorb water where it falls. During a storm, these features slow the water down, store it, and release it gradually. During dry weeks, the stored water keeps street trees alive and cools the air through evaporation.\n\nCritics note that sponge features require maintenance: permeable surfaces clog, and wetlands must be managed. Supporters answer that conventional drains also require expensive maintenance, and that sponge systems provide extra benefits — cleaner water, cooler streets, and habitat for birds and insects — that pipes never offer.",
   questions:[
    {q:"What problem with traditional storm drains does the passage describe?", opts:["They were too expensive to invent","They caused both flooding and falling groundwater","They attracted too many birds","They made rivers flow uphill"], a:1, exp:"Paragraph 1: streets flooded while groundwater fell — 'both flooding and thirst'."},
    {q:"A 'sponge city' is best described as a city that…", opts:["bans rainwater collection","absorbs and stores rain where it falls","pumps seawater into its streets","builds larger concrete drains"], a:1, exp:"Paragraph 2 defines sponge cities by permeable surfaces and storage where rain falls."},
    {q:"The word 'paradoxically' suggests the result was…", opts:["completely expected","seemingly contradictory","scientifically impossible","quickly repaired"], a:1, exp:"Flooding and thirst at the same time seem contradictory."},
    {q:"According to critics, sponge features…", opts:["never work in storms","require ongoing maintenance","are cheaper than all drains","harm street trees"], a:1, exp:"Paragraph 3: 'sponge features require maintenance: permeable surfaces clog… '"},
    {q:"Supporters claim sponge systems provide benefits that pipes do not, including…", opts:["faster internet","cleaner water and cooler streets","free electricity","taller buildings"], a:1, exp:"Final paragraph lists cleaner water, cooler streets, and habitat."}
   ]}
],
listening: [
 { id:"l1", title:"Listening Test 1 — At the Library Desk (conversation)", minutes:8, replay:true,
   script:"Woman: Excuse me, I reserved a book last week — 'The Design of Everyday Life' — but I can't find it on the hold shelf. Man: Let me check. Ah, I see the problem. The book was returned yesterday, but it was shelved in the general collection by mistake. Woman: Oh! So I can just go and get it? Man: Yes, it's on the third floor, in the psychology section. But hurry — another student reserved it this morning, so it can only be checked out for seven days instead of the usual month. Woman: Seven days is fine, I only need chapter four for my essay. Thank you!",
   questions:[
    {q:"Why did the woman come to the desk?", opts:["To renew a book","Because a reserved book was not where she expected","To reserve a classroom","To pay a fine"], a:1, exp:"She reserved the book but couldn't find it on the hold shelf."},
    {q:"Where was the book, in fact?", opts:["Lost","On the hold shelf","In the general collection on the third floor","In another library"], a:2, exp:"It was shelved in the general collection by mistake, third floor, psychology."},
    {q:"Why can she only borrow it for seven days?", opts:["It is a new book","Another student has reserved it","She has a fine","The library is closing"], a:1, exp:"Another student reserved it that morning."},
    {q:"What does the woman need the book for?", opts:["A group project","Chapter four, for her essay","Teaching a class","Leisure reading"], a:1, exp:"'I only need chapter four for my essay.'"},
    {q:"How does the woman feel at the end?", opts:["Annoyed","Confused","Satisfied — seven days is enough","Worried she cannot finish"], a:2, exp:"She says seven days is fine and thanks the man."}
   ]},
 { id:"l2", title:"Listening Test 2 — Why We Sleep (lecture)", minutes:9, replay:true,
   script:"Professor: Today let's ask a simple question scientists still argue about: why do we sleep? One leading idea is memory consolidation. While you sleep, especially during deep sleep, the brain replays experiences from the day and moves important information into long-term storage. Students who sleep after studying consistently remember more than students who stay up all night. A second idea concerns cleaning. During sleep, the spaces between brain cells widen, allowing fluid to wash away waste products that build up while we are awake. And a third idea is energy: sleep reduces energy use at the time of day when searching for food would be least successful anyway. Notice these ideas are not rivals — sleep probably does all three jobs at once.",
   questions:[
    {q:"What is the lecture mainly about?", opts:["How to study all night","Several explanations for why we sleep","The history of sleep research","Dreams and their meanings"], a:1, exp:"The professor presents three ideas about why we sleep."},
    {q:"According to the lecture, deep sleep helps students by…", opts:["cleaning their rooms","moving information into long-term storage","making them dream more","reducing homework"], a:1, exp:"Memory consolidation moves important information into long-term storage."},
    {q:"What happens to the spaces between brain cells during sleep?", opts:["They shrink","They disappear","They widen, allowing cleaning fluid through","They fill with air"], a:2, exp:"Spaces widen so fluid can wash away waste."},
    {q:"The professor says the three ideas are…", opts:["all wrong","not rivals — sleep likely does all three","only true for students","impossible to test"], a:1, exp:"'These ideas are not rivals — sleep probably does all three jobs at once.'"},
    {q:"Why might sleep save energy, according to the lecture?", opts:["Food is easier to find at night","Animals sleep when finding food would be least successful","Sleeping animals eat more","The brain uses no energy at night"], a:1, exp:"Sleep reduces energy use when searching for food would be least successful."}
   ]}
],
speaking: [
 { id:"s1", title:"Speaking Task 1 — A Skill Worth Learning", prep:15, seconds:45, prompt:"Describe a skill you would like to learn in the next year. Explain why this skill interests you and how you plan to learn it. Give specific details and examples." },
 { id:"s2", title:"Speaking Task 2 — Study Alone or in Groups?", prep:15, seconds:45, prompt:"Some students prefer to study alone, while others prefer to study in groups. Which do you prefer, and why? Use specific reasons and examples to support your answer." }
],
writing: [
 { id:"w1", title:"Writing Task 1 — Academic Discussion: Remote Work", minutes:20, minWords:100,
   prompt:"Your professor is teaching a class on business. Write a post responding to the professor's question, making a contribution to the discussion.\n\nProfessor: In the next two classes we will discuss whether companies should allow employees to work fully remotely. What is your view?\n\nClaire: Remote work saves commuting time and helps people focus. Companies should trust their employees.\n\nPaul: I disagree. Offices build teamwork and new employees learn faster in person.",
   source:"" },
 { id:"w2", title:"Writing Task 2 — Integrated: Urban Gardens", minutes:25, minWords:150,
   prompt:"Write an essay summarising the points in the reading passage and explaining how the lecture casts doubt on them.",
   source:"Reading: Urban gardens are often praised, but three problems are overlooked. First, city soil is frequently contaminated with lead and other metals, making home-grown food risky. Second, gardens require large amounts of water in precisely the cities that face shortages. Third, most garden plots are abandoned within five years, leaving neglected, weed-filled lots.\n\nLecture points (listen in Listening Test 2's class notes / ask your instructor): modern raised beds use clean imported soil; drip irrigation uses far less water than lawns; and community-managed plots with waiting lists remain active for decades." }
]
};
const SKILLS = ["reading","listening","speaking","writing"];
const SKILL_LABEL = {reading:"Reading", listening:"Listening", speaking:"Speaking", writing:"Writing"};
</script>
<script>
/* ================= Practice (simplified) =================
   No accounts. Attempts are stored only in this browser so a refresh
   does not lose work. Scores are computed here in app code.
   AI is used ONLY for overall feedback after a session, via the
   server endpoint /api/feedback — never for grading. */
function loadDB(){ try{ const d = JSON.parse(localStorage.getItem(LS_KEY)); if(d && Array.isArray(d.attempts)) return d; }catch(e){} return { attempts: [] }; }
let DB = loadDB();
function saveDB(){ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }

const app = document.getElementById("app");
function nav(){
  return '<nav class="top"><div class="wrap navrow"><a class="logo" href="#/">Practice</a><div class="navlinks">'
   + SKILLS.map(s=>'<a href="#/skill/'+s+'">'+SKILL_LABEL[s]+'</a>').join("")
   + '<a class="btn dark sm" href="#/skill/reading">Start Practicing</a></div></div></nav>';
}
function page(html){ app.innerHTML = nav() + '<main class="wrap">' + html + '</main><footer><div class="wrap row" style="justify-content:space-between"><span>© 2026 Practice — unofficial TOEFL preparation. Not affiliated with ETS.</span><span><a href="#/privacy">Privacy</a> · <a href="#/terms">Terms</a></span></div></footer>'; window.scrollTo(0,0); }

function route(){
  stopTimer();
  const h = location.hash.replace(/^#\/?/, "");
  const [path, qs] = h.split("?"); const seg = path.split("/").filter(Boolean);
  if(!seg.length) return viewLanding();
  if(seg[0]==="privacy") return page('<section class="blk" style="border:none"><h2>Privacy</h2><p class="mut">Practice collects no personal information and has no accounts. Your answers, drafts and recordings are stored only in your own browser (localStorage) so a refresh does not erase your work, and are never sent anywhere except — if AI feedback is configured — the text of a completed Writing response or an objective-score summary, sent to the configured AI provider for overall feedback. Clear your browser site data to delete everything.</p></section>');
  if(seg[0]==="terms") return page('<section class="blk" style="border:none"><h2>Terms</h2><p class="mut">Practice provides unofficial TOEFL preparation. All scores are practice results or clearly-labelled unofficial rubric-style feedback — never official ETS TOEFL scores.</p></section>');
  if(seg[0]==="skill" && SKILLS.includes(seg[1])) return viewSkill(seg[1]);
  if(seg[0]==="test" && seg[1] && seg[2]) return viewTest(seg[1], seg[2]);
  if(seg[0]==="result" && seg[1]) return viewResult(seg[1]);
  return page('<section class="blk" style="border:none"><h2>Page not found</h2><p class="mut"><a href="#/">Go home</a> and choose a skill to start practicing.</p></section>');
}
window.addEventListener("hashchange", route);

/* ================= Landing ================= */
function viewLanding(){
  const cards = SKILLS.map(s=>'<div class="card"><div class="tag">'+SKILL_LABEL[s]+'</div><h3 style="margin-top:8px">'+({reading:"Passages & questions",listening:"Real audio, real questions",speaking:"Record your answer",writing:"Write & get feedback"}[s])+'</h3><p class="mut small">'+({reading:"Original passages with comprehension and vocabulary questions, timed, scored instantly with explanations.",listening:"Conversations and lectures played aloud by a real audio player, with questions and instant scoring.",speaking:"Record in your browser, play it back, retry, and finish — no account, no upload required to practise.",writing:"A clean editor with word count and timer, plus overall feedback on your completed response."}[s])+'</p><p style="margin-top:12px"><a class="btn sm" href="#/skill/'+s+'">Start '+SKILL_LABEL[s]+'</a></p></div>').join("");
  page('<div class="hero"><h1>Prepare with purpose. Practice with confidence.</h1><p class="sub">Practice TOEFL Reading, Listening, Speaking, and Writing in one place. No sign-up — open a skill and start.</p><div class="row"><a class="btn dark" href="#/skill/reading">Start Practicing</a><a class="btn" href="#how">How it works</a></div>'
   + '<div class="preview"><div class="tag">Practice — Reading</div><h3 style="margin-top:10px">The Honeybee\u2019s Compass</h3><p class="mut small">Read the passage, answer 5 questions, see your score and an explanation for every question — instantly.</p><div class="bar"><i style="width:60%"></i></div><p class="faint small" style="margin-top:8px">Question 3 of 5</p></div></div>'
   + '<section class="blk"><h2>Four skills. One place.</h2><div class="grid">'+cards+'</div></section>'
   + '<section class="blk" id="how"><h2>How it works</h2><div class="grid3"><div><h3>1. Choose a skill</h3><p class="mut small">Reading, Listening, Speaking, or Writing.</p></div><div><h3>2. Complete a session</h3><p class="mut small">Answer questions, record, or write — with a timer when you want one.</p></div><div><h3>3. Review your results</h3><p class="mut small">See your score, explanations, and overall feedback, then retry or try another skill.</p></div></div></section>'
   + '<section class="blk"><h2>Start now — it takes ten seconds.</h2><div class="row"><a class="btn dark" href="#/skill/reading">Start Practicing</a></div></section>');
  if(location.hash==="#how"){ const el=document.getElementById("how"); if(el) el.scrollIntoView(); }
}

/* ================= Skill home ================= */
function viewSkill(skill){
  const tests = CONTENT[skill];
  const rows = tests.map(t=>{
    const inProg = DB.attempts.find(a=>a.testId===t.id && a.status==="in_progress");
    const done = DB.attempts.filter(a=>a.testId===t.id && a.status==="submitted");
    const best = done.filter(a=>typeof a.score==="number").sort((a,b)=>(b.score/b.total)-(a.score/a.total))[0];
    return '<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><div><h3>'+esc(t.title)+'</h3><p class="mut small">'
     + (t.questions ? t.questions.length+" questions · "+t.minutes+" min" : skill==="speaking" ? "Respond in "+t.seconds+"s · "+t.prep+"s preparation" : t.minutes+" min · at least "+t.minWords+" words")
     + (best?" · Best score: "+best.score+"/"+best.total:"") + (inProg?" · Session in progress":"")
     + '</p></div><a class="btn sm '+(inProg?"":"dark")+'" href="#/test/'+skill+'/'+t.id+'">'+(inProg?"Resume":"Start")+'</a></div></div>'; }).join("");
  page('<div style="padding:48px 0"><div class="tag">'+SKILL_LABEL[skill]+'</div><h2 style="margin-top:6px">'+SKILL_LABEL[skill]+' Practice</h2><p class="mut" style="margin-bottom:26px">'
   + ({reading:"Read the passage and answer every question. Your answers save automatically in this browser.",listening:"Press play — the audio is read aloud by your device\u2019s speech voice. Replay is allowed in practice.",speaking:"Record with your microphone, listen back, re-record if you like, then finish the session.",writing:"Write in the editor — your draft is kept in this browser until you submit."}[skill])
   + '</p>'+rows+'<p style="margin-top:8px"><a href="#/">← Home</a></p></div>');
}

/* ================= Test engine ================= */
let timerHandle = null;
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle = null; } }
function getOrCreateAttempt(skill, test){
  let a = DB.attempts.find(x=>x.testId===test.id && x.status==="in_progress");
  if(!a){ a = { id:uid(), skill, testId:test.id, title:test.title, status:"in_progress", answers:{}, writingText:"", recording:null, startedAt:nowISO(), deadlineAt: test.minutes ? new Date(Date.now()+test.minutes*60000).toISOString() : null, submittedAt:null, score:null, total: test.questions ? test.questions.length : null }; DB.attempts.push(a); saveDB(); }
  return a;
}
function startTimer(attempt, onExpire){
  stopTimer(); const el = document.getElementById("timerEl"); if(!el || !attempt.deadlineAt) return;
  const tick = ()=>{ const left = new Date(attempt.deadlineAt).getTime() - Date.now();
    if(left<=0){ el.textContent="0:00"; stopTimer(); onExpire && onExpire(); return; }
    const m = Math.floor(left/60000), s = Math.floor(left%60000/1000); el.textContent = m+":"+String(s).padStart(2,"0"); };
  tick(); timerHandle = setInterval(tick, 500);
}
function scoreObjective(test, answers){ let s=0; test.questions.forEach((q,i)=>{ if(Number(answers[i])===q.a) s++; }); return s; }
function submitAttempt(attempt, test){
  if(attempt.status==="submitted") return;
  if(test.questions){ attempt.score = scoreObjective(test, attempt.answers); attempt.total = test.questions.length; }
  attempt.status = "submitted"; attempt.submittedAt = nowISO(); stopTimer(); saveDB();
  location.hash = "#/result/" + attempt.id;
}
function confirmSubmit(attempt, test){
  const un = test.questions ? test.questions.filter((q,i)=>attempt.answers[i]===undefined).length : 0;
  const bg = document.createElement("div"); bg.className="modalBg";
  bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h3>Submit this session?</h3><p class="mut">'+(un? un+" question(s) are still unanswered. " : "All questions are answered. ")+'You will see your score, explanations, and overall feedback.</p><div class="row" style="margin-top:20px"><button class="btn dark" id="mYes" type="button">Submit</button><button class="btn" id="mNo" type="button">Keep working</button></div></div>';
  document.body.appendChild(bg);
  bg.querySelector("#mNo").onclick = ()=>bg.remove();
  bg.querySelector("#mYes").onclick = ()=>{ bg.remove(); submitAttempt(attempt, test); };
}
function viewTest(skill, testId){
  const test = (CONTENT[skill]||[]).find(t=>t.id===testId);
  if(!test){ location.hash="#/"; return; }
  const attempt = getOrCreateAttempt(skill, test);
  if(skill==="reading" || skill==="listening") return viewObjective(skill, test, attempt);
  if(skill==="speaking") return viewSpeaking(test, attempt);
  if(skill==="writing") return viewWriting(test, attempt);
}
function viewObjective(skill, test, attempt){
  const isL = skill==="listening"; let cur = 0;
  const left = isL
   ? '<div class="card"><h3>Audio</h3><p class="mut small">Press play to hear the '+(test.id==="l1"?"conversation":"lecture")+'. Practice mode: replay is allowed.</p><div class="row" style="margin-top:12px"><button class="btn dark sm" id="playBtn" type="button">▶ Play audio</button><button class="btn sm" id="stopBtn" type="button">Stop</button></div><p class="small faint" id="audioState" style="margin-top:10px" role="status">Audio is read aloud by your device\u2019s speech voice. If no voice is available on this device, you can still read the transcript below and answer.</p><details style="margin-top:14px"><summary class="small">Show transcript (practice aid)</summary><p class="small mut" style="margin-top:8px">'+esc(test.script)+'</p></details></div>'
   : '<div class="card"><h3>Passage</h3><div class="passage">'+esc(test.passage)+'</div></div>';
  page('<div style="padding:32px 0"><div class="row" style="justify-content:space-between"><div><div class="tag">'+SKILL_LABEL[skill]+'</div><h2 style="margin-top:4px">'+esc(test.title)+'</h2></div><div class="timer" id="timerEl" aria-live="polite"></div></div><div class="split" style="margin-top:20px"><div>'+left+'</div><div><div id="qArea"></div><div class="qnav" id="qNav" style="margin:16px 0"></div><div class="row"><button class="btn" id="prevBtn" type="button">← Previous</button><button class="btn" id="nextBtn" type="button">Next →</button><button class="btn dark" id="submitBtn" type="button">Submit</button></div><p class="small faint" style="margin-top:10px">Answers save automatically in this browser. The session submits itself when the timer runs out.</p></div></div></div>');
  function renderQ(){
    const q = test.questions[cur];
    $("#qArea").innerHTML = '<div class="qbox"><div class="tag">Question '+(cur+1)+' of '+test.questions.length+'</div><h3 style="margin-top:8px">'+esc(q.q)+'</h3>' + q.opts.map((o,i)=>'<label class="opt'+(Number(attempt.answers[cur])===i?" sel":"")+'"><input type="radio" name="opt" value="'+i+'"'+(Number(attempt.answers[cur])===i?" checked":"")+'> <span>'+esc(o)+'</span></label>').join("") + '</div>';
    $$("#qArea input[name=opt]").forEach(inp=> inp.addEventListener("change", ()=>{ attempt.answers[cur]=Number(inp.value); saveDB(); renderQ(); }));
    $("#qNav").innerHTML = test.questions.map((qq,i)=>'<button type="button" data-i="'+i+'" class="'+(attempt.answers[i]!==undefined?"done":"")+(i===cur?" cur":"")+'">'+(i+1)+'</button>').join("");
    $$("#qNav button").forEach(b=> b.addEventListener("click", ()=>{ cur=Number(b.dataset.i); renderQ(); }));
    $("#prevBtn").disabled = cur===0; $("#nextBtn").disabled = cur===test.questions.length-1;
  }
  renderQ();
  $("#prevBtn").addEventListener("click", ()=>{ if(cur>0){cur--; renderQ();} });
  $("#nextBtn").addEventListener("click", ()=>{ if(cur<test.questions.length-1){cur++; renderQ();} });
  $("#submitBtn").addEventListener("click", ()=> confirmSubmit(attempt, test));
  startTimer(attempt, ()=> submitAttempt(attempt, test));
  if(isL){
    const state = $("#audioState");
    $("#playBtn").addEventListener("click", ()=>{
      if(!("speechSynthesis" in window)){ state.textContent = "Speech is not supported in this browser — use the transcript practice aid below."; return; }
      speechSynthesis.cancel(); const utt = new SpeechSynthesisUtterance(test.script); utt.rate = 0.95;
      utt.onend = ()=> state.textContent = "Playback finished. You may replay in practice mode.";
      state.textContent = "Playing…"; speechSynthesis.speak(utt);
    });
    $("#stopBtn").addEventListener("click", ()=>{ if("speechSynthesis" in window) speechSynthesis.cancel(); state.textContent = "Playback stopped."; });
  }
}
function viewSpeaking(test, attempt){
  page('<div style="padding:32px 0;max-width:760px"><div class="tag">Speaking · Response '+test.seconds+'s</div><h2 style="margin-top:4px">'+esc(test.title)+'</h2><div class="qbox"><h3>Prompt</h3><p>'+esc(test.prompt)+'</p><p class="small mut" style="margin-top:8px">Preparation: '+test.prep+' seconds. Your microphone is used only when you press Record, and the recording stays in this browser.</p></div><div class="card"><div class="row"><button class="btn dark" id="recBtn" type="button">● Record</button><button class="btn" id="stopRecBtn" type="button" disabled>Stop</button><span class="timer" id="recTime">0:00</span><span class="small mut" id="recState" role="status">Not recorded yet</span></div><div style="margin-top:14px"><audio id="playBack" controls style="width:100%"></audio></div><div class="row" style="margin-top:16px"><button class="btn dark" id="subSpeak" type="button" disabled>Finish session</button></div><div id="speakErr"></div></div></div>');
  let mr=null, chunks=[], rt=null, start=0;
  const recBtn=$("#recBtn"), stopBtn=$("#stopRecBtn"), subBtn=$("#subSpeak"), audioEl=$("#playBack"), stateEl=$("#recState");
  if(attempt.recording){ audioEl.src=attempt.recording; subBtn.disabled=false; stateEl.textContent="A recording is saved — re-record to replace it, or finish."; }
  recBtn.addEventListener("click", async ()=>{
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      chunks=[]; mr=new MediaRecorder(stream);
      mr.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
      mr.onstop = ()=>{ stream.getTracks().forEach(t=>t.stop()); clearInterval(rt);
        const blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" }); const rd = new FileReader();
        rd.onload = ()=>{ attempt.recording = rd.result; saveDB(); audioEl.src = attempt.recording; subBtn.disabled=false; stateEl.textContent="Recorded. Listen back, re-record, or finish."; };
        rd.readAsDataURL(blob); };
      mr.start(); start=Date.now(); stateEl.textContent="Recording…"; recBtn.disabled=true; stopBtn.disabled=false;
      rt=setInterval(()=>{ const s=Math.floor((Date.now()-start)/1000); $("#recTime").textContent = Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); if(s>=test.seconds) stopBtn.click(); },250);
    }catch(err){ $("#speakErr").innerHTML = '<div class="msg" style="margin-top:12px" role="alert">Microphone access was denied or is unavailable in this browser. You can still read the prompt and practise aloud — recording needs mic permission.</div>'; }
  });
  stopBtn.addEventListener("click", ()=>{ if(mr && mr.state!=="inactive") mr.stop(); recBtn.disabled=false; stopBtn.disabled=true; });
  subBtn.addEventListener("click", ()=>{ if(attempt.recording) submitAttempt(attempt, test); });
}
function viewWriting(test, attempt){
  page('<div style="padding:32px 0;max-width:820px"><div class="row" style="justify-content:space-between"><div><div class="tag">Writing · '+test.minutes+' min</div><h2 style="margin-top:4px">'+esc(test.title)+'</h2></div><div class="timer" id="timerEl" aria-live="polite"></div></div><div class="qbox"><h3>Prompt</h3><p style="white-space:pre-wrap">'+esc(test.prompt)+'</p>'+(test.source?'<h3 style="margin-top:16px">Source material</h3><p style="white-space:pre-wrap" class="mut">'+esc(test.source)+'</p>':"")+'</div><label for="wText" style="font-size:13px;font-weight:600;display:block;margin:14px 0 6px">Your response <span class="faint">(draft is kept in this browser)</span></label><textarea id="wText" rows="14" placeholder="Write your response here…">'+esc(attempt.writingText||"")+'</textarea><div class="row" style="justify-content:space-between;margin-top:10px"><span class="small mut"><span id="wCount">0</span> words · suggested minimum '+test.minWords+'</span><span class="small faint" id="wSaved"></span></div><div class="row" style="margin-top:16px"><button class="btn dark" id="subWrite" type="button">Submit &amp; see results</button></div></div>');
  const ta = $("#wText");
  const upd = ()=>{ $("#wCount").textContent = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0; };
  upd();
  ta.addEventListener("input", ()=>{ attempt.writingText = ta.value; saveDB(); upd(); $("#wSaved").textContent = "Draft saved " + new Date().toLocaleTimeString(); });
  $("#subWrite").addEventListener("click", ()=>{ if(!ta.value.trim()){ alert("Write something before submitting."); return; } if(confirm("Submit this response and see your results?")){ attempt.writingText = ta.value; submitAttempt(attempt, test); } });
  startTimer(attempt, ()=>{ attempt.writingText = ta.value; submitAttempt(attempt, test); });
}

/* ================= Results + overall AI feedback ================= */
async function fetchOverallFeedback(a, test){
  const box = document.getElementById("aiFeedback"); if(!box) return;
  if(a.skill === "speaking"){
    box.innerHTML = '<div class="tag">Overall feedback</div><p class="mut" style="margin-top:8px">AI evaluation of recordings is not configured for this site, so no score or analysis has been generated for your recording — nothing here is fabricated. You can listen back above and use the prompt\u2019s criteria to self-review: clear position, specific examples, and organised ideas.</p>'; return;
  }
  box.innerHTML = '<div class="tag">Overall feedback</div><p class="mut" style="margin-top:8px">Requesting AI-generated overall feedback…</p>';
  const payload = { skill:a.skill, title:a.title,
    score: (typeof a.score==="number" ? a.score : undefined), total: a.total || undefined,
    prompt: test && test.prompt ? test.prompt : undefined,
    response: a.skill==="writing" ? (a.writingText||"").slice(0,6000) : undefined,
    missed: test && test.questions ? test.questions.filter((q,i)=>Number(a.answers[i])!==q.a).map(q=>q.q) : undefined };
  try{
    const res = await fetch("/api/feedback", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) });
    const data = await res.json().catch(()=>null);
    if(data && data.available && data.feedback){
      box.innerHTML = '<div class="tag">Overall feedback · AI-generated · Unofficial</div><p style="margin-top:8px;white-space:pre-wrap"></p>';
      box.querySelector("p").textContent = data.feedback;
    } else {
      box.innerHTML = '<div class="tag">Overall feedback</div><p class="mut" style="margin-top:8px">AI feedback is not configured for this site yet, so no AI evaluation has been generated — your score above is computed by Practice itself and is final for this session. To enable AI feedback, the site owner sets an AI provider key on the server (see README).</p>';
    }
  }catch(e){
    box.innerHTML = '<div class="tag">Overall feedback</div><p class="mut" style="margin-top:8px">AI feedback could not be reached right now. Your results above are complete without it — nothing has been estimated or substituted.</p>';
  }
}
function viewResult(attemptId){
  const a = DB.attempts.find(x=>x.id===attemptId && x.status==="submitted");
  if(!a){ page('<section class="blk" style="border:none"><h2>Result not found</h2><p class="mut">That session is not on this device. <a href="#/">Go home</a></p></section>'); return; }
  const test = (CONTENT[a.skill]||[]).find(t=>t.id===a.testId);
  let main = "";
  if(test && test.questions){
    const correct = a.score, incorrect = a.total - a.score, pct = Math.round(a.score/a.total*100);
    main = '<div class="card" style="margin-bottom:20px"><div class="tag">Your score</div><div class="stat">'+a.score+' / '+a.total+' · '+pct+'%</div><p class="mut small">'+correct+' correct · '+incorrect+' incorrect</p><div class="bar"><i style="width:'+pct+'%"></i></div></div>'
     + test.questions.map((q,i)=>{ const mine=a.answers[i]; const ok=Number(mine)===q.a; return '<div class="qbox"><div class="tag">Question '+(i+1)+' — '+(ok?"Correct":"Not correct")+'</div><h3 style="margin-top:6px">'+esc(q.q)+'</h3>'+ q.opts.map((o,j)=>'<div class="opt'+(j===q.a?" correct":(Number(mine)===j?" wrong":""))+'"><span>'+esc(o)+(j===q.a?" ✓":"")+'</span></div>').join("") + '<div class="expl"><strong>Explanation:</strong> '+esc(q.exp)+'</div></div>'; }).join("");
  } else if(a.skill==="speaking"){
    main = '<div class="card"><h3>Your recording</h3>'+(a.recording?'<audio controls src="'+a.recording+'" style="width:100%"></audio>':'<p class="mut">No recording was stored with this session.</p>')+'</div>';
  } else if(a.skill==="writing"){
    main = '<div class="card"><h3>Your response</h3><p style="white-space:pre-wrap">'+esc(a.writingText||"")+'</p><p class="mut small" style="margin-top:10px">'+(a.writingText? a.writingText.trim().split(/\s+/).length : 0)+' words</p></div>';
  }
  page('<div style="padding:40px 0"><div class="tag">'+SKILL_LABEL[a.skill]+' · Completed '+fmtDate(a.submittedAt)+'</div><h2 style="margin-top:4px">'+esc(a.title)+'</h2><div style="margin-top:20px">'+main+'</div><div class="card" id="aiFeedback" style="margin-top:16px"></div><p class="row" style="margin-top:22px"><a class="btn dark" href="#/skill/'+a.skill+'">Practise '+SKILL_LABEL[a.skill]+' again</a><a class="btn" href="#/">Choose another skill</a></p></div>');
  fetchOverallFeedback(a, test);
}

route();

</script>
